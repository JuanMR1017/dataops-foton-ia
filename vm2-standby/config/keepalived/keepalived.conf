! Configuración de Keepalived - VM2 (Nodo Respaldo / BACKUP)
! Ver documentación: docs/08-alta-disponibilidad/keepalived.md
! IMPORTANTE: virtual_router_id, auth_pass y virtual_ipaddress deben ser IDÉNTICOS a VM1.

vrrp_script chk_postgres {
    script "/etc/keepalived/scripts/check_postgres.sh"
    interval 2
    weight 20
    fall 2
    rise 2
}

vrrp_instance FOTON_HA {
    state BACKUP                 # rol inicial preferido de este nodo
    interface eth0                # AJUSTAR: nombre real de la interfaz de red
    virtual_router_id 51          # debe coincidir exactamente con VM1
    priority 100                  # más bajo que VM1 (150): solo asume el rol si VM1 falla
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass foton_ha_2024   # AJUSTAR: mismo secreto que VM1
    }

    virtual_ipaddress {
        192.168.1.100/24          # AJUSTAR: misma VIP que VM1
    }

    track_script {
        chk_postgres
    }
}
