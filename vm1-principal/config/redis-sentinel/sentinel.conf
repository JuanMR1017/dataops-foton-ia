# Configuración de Redis Sentinel - correr una copia en VM1, VM2 y VM3 (quórum de 3)
# Ver documentación: docs/08-alta-disponibilidad/redis-sentinel.md
# AJUSTAR: IP_VM1 según cuál sea el master en el momento de la instalación inicial.

port 26379
sentinel monitor mymaster 192.168.1.10 6379 2   # nombre lógico, IP:puerto del master, quórum=2 de 3
sentinel auth-pass mymaster CAMBIAR_ESTA_CLAVE   # misma clave que requirepass/masterauth de Redis
sentinel down-after-milliseconds mymaster 5000   # tiempo sin respuesta para considerarlo caído
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
