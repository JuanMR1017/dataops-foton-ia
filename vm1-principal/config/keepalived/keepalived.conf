! Configuración de Keepalived - VM1 (Nodo Principal / MASTER)
! Ver documentación: docs/08-alta-disponibilidad/keepalived.md

vrrp_script chk_postgres {
    script "/etc/keepalived/scripts/check_postgres.sh"
    interval 2      # revisa cada 2 segundos
    weight 20       # si falla, resta 20 a la prioridad efectiva
    fall 2          # necesita 2 chequeos fallidos seguidos para considerarlo caído
    rise 2          # necesita 2 chequeos exitosos para considerarlo recuperado
}

vrrp_instance FOTON_HA {
    state MASTER                 # rol inicial preferido de este nodo
    interface eth0                # AJUSTAR: nombre real de la interfaz de red
    virtual_router_id 51          # debe coincidir exactamente con VM2
    priority 150                  # más alto que VM2 (100), gana en igualdad de condiciones
    advert_int 1                  # segundos entre anuncios VRRP

    authentication {
        auth_type PASS
        auth_pass foton_ha_2024   # AJUSTAR: usar un secreto real, igual en VM1 y VM2
    }

    virtual_ipaddress {
        192.168.1.100/24          # AJUSTAR: la VIP real del clúster
    }

    track_script {
        chk_postgres
    }
}
